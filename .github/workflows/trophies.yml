name: Generate Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Trophies
        run: |
          curl -sL "https://github-profile-trophy-fork.vercel.app/?username=vv1ck&theme=tokyonight&no-frame=true&no-bg=true" -o trophies.svg
      - name: Commit File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git commit -m "Update trophies" || exit 0
          git push
